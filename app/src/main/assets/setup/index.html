function render(){
root.querySelectorAll('.pg-route span').forEach((x,i)=>x.classList.toggle('active',i===(s.step<3?0:s.step<5?1:2)));
if(s.step===0){main.innerHTML=`<div class="pg-hero"><div><p class="pg-eyebrow">WELCOME TO YOUR BIG SCREEN</p><h1>Let\u2019s get your A5 ready,<br>${esc(displayName)}.</h1><p>Your favourite apps. A smoother projector.<br>All set up together.</p><div class="pg-list"><span>\u2713 Choose your apps</span><span>\u2713 Make it yours</span><span>\u2713 Start watching</span></div><p class="pg-subnote">${ready?(s.pending?'Your previous choices are saved. Continue to pick up where you left off.':`${apps.filter(a=>a.kind==='update').length} updates available \xb7 Installed apps checked`):'Checking your A5 and the app library\u2026'}</p>${error?`<p class="pg-subnote" role="alert">${esc(error)}</p>`:''}</div><img class="pg-projector" src="${assets.a5}" alt="XBJ A5 Pro"></div>`;buttons(error?'Retry connection':ready?(s.pending?'Resume setup \u2192':'Let\u2019s go \u2192'):'Checking apps\u2026',false,!ready&&!error);}
if(s.step===1){main.innerHTML=`<h1>What do you love watching?</h1><p>We\u2019ve checked your apps. Choose the extras and updates you want.</p><div class="pg-tabs"><button data-tab="stream" aria-selected="${s.tab==='stream'}">Streaming</button><button data-tab="live" aria-selected="${s.tab==='live'}">Live TV & guide</button><button data-act="recommended">Recommended apps</button></div><div class="pg-apps">${apps.filter(a=>a.group===(s.tab==='stream'?'streaming':'live')).map(a=>`<label class="pg-app"><img src="icons/${esc(a.icon.split('/').pop())}" alt=""><div><strong>${esc(a.name)}</strong><small>${a.kind==='keep'?'Already installed':a.kind==='update'?'Update available':'Add'}${a.id==='org.beebplayer.android'?' \xb7 Beeb, independent player':''}</small></div>${a.kind==='keep'?'<small>\u2713</small>':`<input type="checkbox" data-app="${esc(a.id)}" aria-label="${esc(a.name)}" ${s.selected.includes(a.id)?'checked':''}>`}</label>`).join('')}</div><p class="pg-subnote">${chosen().length} selected \xb7 Installed apps stay \xb7 Sign-ins are kept where possible</p>`;buttons('Next: make it yours \u2192');}
if(s.step===2){main.innerHTML=`<h1>A few little upgrades.</h1><p>Recommended settings are on. Change any now, or adjust them later.</p><div class="pg-options">${opts.map(([t,d],i)=>`<label class="pg-option"><div><strong>${t}</strong><p>${d}</p></div><input type="checkbox" aria-label="${t}" data-opt="${i}" ${s.opts[i]?'checked':''}></label>`).join('')}</div><p class="pg-subnote">Your choices are remembered after restarting.</p>`;buttons('Set up my projector \u2192');}
if(s.step===3){const active=apps.find(a=>job.includes(a.name))||chosen()[0];main.innerHTML=`<p class="pg-eyebrow">WE\u2019VE GOT THIS</p><h1>Pop the kettle on.</h1><p>You can put the remote down\u2026 make yourself a brew.<br>We\u2019ll take care of each selected app, then your improvements.</p><div class="pg-current">${active&&phase==='apps'?`<img src="icons/${esc(active.icon.split('/').pop())}" alt="">`:`<img src="${assets.a5}" alt="">`}<div><h2>${phase==='apps'?'Getting your apps ready':'Making your A5 yours'}</h2><p>${esc(job||'Preparing setup\u2026')}</p></div></div><div class="pg-status"><span>${phase==='apps'?`${results.filter(a=>['ready','kept'].includes(a.status)).length} apps ready \xb7 Improvements next`:'Saving preferences and preparing installed apps'}</span><span>${jobPercent}%</span></div><div class="pg-progress" role="progressbar" aria-valuenow="${jobPercent}" aria-valuemin="0" aria-valuemax="100" aria-label="Setup progress"><span style="width:${jobPercent}%"></span></div><p class="pg-subnote">Progress follows completed work. Your choices are saved if setup is interrupted.</p>`;actions.innerHTML=phase==='apps'?'<button data-act="stop">Stop after this app</button>':'<button disabled>Applying improvements\u2026</button>';}
if(s.step===4){const bad=attention();main.innerHTML=`<p class="pg-eyebrow">ALMOST THERE</p><h1>${error?'One thing needs a hand.':`${results.filter(a=>['ready','kept'].includes(a.status)).length} ready \xb7 ${bad.length} need attention`}</h1><p>Your other apps are safe. Retry below, or leave these for later.</p><div class="pg-issues">${bad.map(a=>`<div class="pg-issue"><div><h2>${esc(a.name)}</h2><p>${esc(a.message||'Setup was stopped before this app finished.')}</p></div></div>`).join('')}${error?`<div class="pg-issue"><div><h2>Projector setup</h2><p>${esc(error)}</p></div></div>`:''}</div><div class="pg-recovery"><button class="pg-inline primary" data-act="retry">Retry</button>${error?'<button class="pg-inline" data-act="developer">Connection settings</button>':''}</div><p class="pg-subnote">Apps with a different signature are kept with their existing login.</p>`;buttons('Do this later \u2192',false);}
if(s.step===5){main.innerHTML=`<div class="pg-done"><img src="${assets.a5}" alt="A5 Pro"><span class="pg-check">\u2713</span></div><h1>Your A5 is ready, ${esc(displayName)}.</h1><p>Pick up the remote. Put your feet up. Enjoy.</p><div class="pg-summary"><span>\u2713 ${results.filter(a=>['ready','kept'].includes(a.status)).length} apps processed</span><span>${s.optDone?'\u2713 Improvements saved':'Improvements available later'}</span>${attention().length?`<span>${attention().length} left for later</span>`:''}</div><p>You\u2019ll go straight to Home next time you open Projector Guy.</p>`;buttons('One more thing\u2026 \u2192',false);}
}
function go(n){s.step=n;save();render();focusPrimary();}
function begin(ids){busy=true;s.pending=true;phase='apps';job='Preparing selected apps\u2026';jobPercent=0;save();go(3);last='';A5Setup.installSelected(JSON.stringify(ids));}
function optimise(){busy=true;phase='optimise';job='Applying your preferences\u2026';jobPercent=0;s.step=3;save();render();last='';A5Setup.optimise(JSON.stringify(choiceObject()));}
function finishWork(){busy=false;s.pending=false;save();if(attention().length||error)go(4);else{A5Setup.markComplete();go(5);}}
function poll(){try{const raw=A5Setup.status();if(raw===last)return;last=raw;const d=JSON.parse(raw);
if(d.state==='scanned'){apps=(d.apps||[]).filter(a=>a.name!=='Roblox').map(a=>({...a,name:a.name.startsWith('TellyGrid')?'Live TV guide':a.name}));const valid=new Set(apps.filter(a=>a.kind!=='keep').map(a=>a.id));if(!localStorage.getItem('pg_setup_v2'))s.selected=apps.filter(a=>a.kind==='update').map(a=>a.id);else s.selected=s.selected.filter(id=>valid.has(id));ready=true;error='';save();render();focusPrimary();}
else if(d.state==='installing'){phase='apps';job=d.message;mergeResults(d.apps||[]);jobPercent=d.total?Math.min(99,Math.floor(d.index/d.total*100)):0;s.step=3;render();}
else if(d.state==='installed'){mergeResults(d.apps||[]);busy=false;jobPercent=100;retryMode='apps';if(autoOptimise){autoOptimise=false;setTimeout(optimise,150);}else finishWork();}
else if(d.state==='optimising'){phase='optimise';job=d.message;jobPercent=d.total?Math.min(99,Math.floor(d.index/d.total*100)):0;s.step=3;render();}
else if(d.state==='optimised'){busy=false;s.optDone=true;error='';retryMode='';finishWork();}
else if(d.state==='error'){busy=false;error=d.message;retryMode=phase;if(!ready){render();focusPrimary();}else go(4);}
}catch(e){busy=false;error='Setup could not read the projector status. Please reopen Projector Guy to retry.';go(4);}}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||busy&&b.dataset.act!=='stop')return;
if(b.dataset.tab){s.tab=b.dataset.tab;save();render();root.querySelector(`[data-tab="${s.tab}"]`)?.focus();return;}
switch(b.dataset.act){case'next':if(s.step===0&&error){error='';ready=false;last='';A5Setup.retryScan();render();}else if(s.step<2)go(s.step+1);else if(s.step===2){autoOptimise=true;begin(chosen().map(a=>a.id));}else if(s.step===4){error='';A5Setup.markComplete();go(5);}else if(s.step===5)A5Setup.endCard();break;case'back':go(Math.max(0,s.step-1));break;case'recommended':s.selected=apps.filter(a=>a.kind==='update'||['com.amazon.amazonvideo.livingroom','org.beebplayer.android'].includes(a.id)&&a.kind!=='keep').map(a=>a.id);save();render();break;case'stop':autoOptimise=false;A5Setup.stopAfterApp();b.textContent='Stopping after this app\u2026';b.disabled=true;break;case'developer':A5Setup.openDeveloperOptions();break;case'retry':error='';if(retryMode==='optimise')optimise();else{const ids=attention().map(a=>a.id);autoOptimise=!s.optDone;begin(ids.length?ids:chosen().map(a=>a.id));}break;}
});
root.addEventListener('change',e=>{const x=e.target;if(x.dataset.app){s.selected=x.checked?[...new Set([...s.selected,x.dataset.app])]:s.selected.filter(id=>id!==x.dataset.app);save();render();root.querySelector(`[data-app="${x.dataset.app}"]`)?.focus();}if(x.dataset.opt!==undefined){s.opts[+x.dataset.opt]=x.checked;save();}});
root.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;const c=document.activeElement;if(!root.contains(c))return;const a=c.getBoundingClientRect(),x=a.x+a.width/2,y=a.y+a.height/2,h=e.key==='ArrowLeft'||e.key==='ArrowRight',sign=e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:1;const next=[...root.querySelectorAll('button:not(:disabled),input:not(:disabled)')].filter(b=>b!==c&&b.getClientRects().length).map(b=>{const r=b.getBoundingClientRect(),dx=r.x+r.width/2-x,dy=r.y+r.height/2-y;return {b,f:(h?dx:dy)*sign,c:Math.abs(h?dy:dx)};}).filter(z=>z.f>4).sort((a,b)=>(a.f+a.c*3)-(b.f+b.c*3))[0];if(next){e.preventDefault();next.b.focus();}});
window.pgSetupBack=()=>{if(!busy)go(Math.max(0,s.step-1));};
render();setInterval(poll,650);poll();
})();
</script>
