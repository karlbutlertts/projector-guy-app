 function saved(data){if(!data||typeof data!=='object')return;if(Array.isArray(data.selected))state.selected=data.selected.filter(x=>all().some(a=>a.id===x&&a.kind!=='keep'));if(data.optimise)opts.forEach(([id])=>{if(typeof data.optimise[id]==='boolean')state.optimise[id]=data.optimise[id];});if(Number.isInteger(data.step)&&data.step>=0&&data.step<=5)state.step=data.step;}

  root.querySelector('#pg-step-label').textContent=`Step ${state.step+1} of 6`;
  root.querySelector('#pg-track-fill').style.width=((state.step+1)/6*100)+'%';
  if(state.step===0){stage.innerHTML=header('Let’s get your A5 ready','We’ve checked your installed apps against the Projector Guy library.')+`<div class="pg-intro"><div class="pg-intro-list"><div class="pg-check-line"><span class="pg-check-mark">✓</span><div><h3>${all().filter(a=>a.kind==='update').length} app updates ready</h3><p>Current and newer apps stay as they are. Updates with a different signature are kept for manual review.</p></div></div><div class="pg-check-line"><span class="pg-check-mark">✓</span><div><h3>Choose the extras you want</h3><p>Streaming first, then Live TV and your TV guide.</p></div></div><div class="pg-check-line"><span class="pg-check-mark">✓</span><div><h3>One approval may be needed</h3><p>${design.approvalNeeded?'We’ll ask once if Android needs permission.':'Approve this app’s debugging prompt if Android asks, then setup runs quietly.'}</p></div></div></div><div class="pg-projector"><img src="${a5Image}" alt="" style="height:125px;width:160px;object-fit:contain"><h3>XBJ A5 Pro</h3><small>✓ Model and app check complete</small></div></div>`;actions.innerHTML=buttons('Choose my apps',false,'<button type="button" class="pg-button pg-quiet" data-action="skip-setup">Set up later</button>');}
  if(state.step===1){stage.innerHTML=header('Your streaming, ready to watch','Existing app updates are selected. Tick any extras you want to add.')+`<div class="pg-app-grid">${streaming.map(appCard).join('')}</div><div class="pg-selection-summary">${pick().filter(a=>streaming.some(s=>s.id===a.id)).length} changes selected · newer apps won’t be downgraded</div>`;actions.innerHTML=buttons('Next: Live TV');}
  if(state.step===2){stage.innerHTML=header('Add your Live TV favourites','Tick the apps you want. You can add more from the library later.')+`<div class="pg-app-grid pg-live-grid">${live.map(appCard).join('')}</div><div class="pg-selection-summary">${pick().filter(a=>live.some(l=>l.id===a.id)).length} Live TV apps selected</div>`;actions.innerHTML=buttons('Review & install');}
  if(state.step===3){
   const list=state.queue.length?state.queue:pick();
   stage.innerHTML=header(state.queueFinished?'Your apps are ready':state.running?'Getting your apps ready':'Everything in one place',state.running?'You can put the remote down… pop the kettle on and make yourself a brew. We’ll take care of each selected app.':state.queueFinished?'Sign in to your apps whenever you’re ready.':'We’ll update or install these apps one by one. Existing sign-ins are kept where an in-place update is possible.')+`<div class="pg-queue">${list.length?list.map((a,i)=>{let status=state.installed.includes(a.id)?'✓ Ready':state.skipped.includes(a.id)?'Skipped':state.running&&i===state.index?['Downloading…','Checking APK…','Installing…'][state.phase]:'Waiting';if(state.pending===a.id)status='Needs your OK';return `<div class="pg-queue-row"><span class="pg-app-icon">${logo(a)}</span><div>${esc(a.name)}<small>${a.kind==='update'?'Update':'Install'}</small></div><span class="pg-status${state.installed.includes(a.id)?' pg-success':''}">${status}</span></div>`;}).join(''):'<p>No app changes selected. Continue to optimisation.</p>'}</div>${state.running||state.queueFinished?`<div class="pg-progress-heading"><span>${state.queueFinished?'App setup complete':state.pending?'Waiting for your choice':`App ${Math.min(state.index+1,list.length)} of ${list.length}`}</span><span>${state.installed.length} ready${state.skipped.length?` · ${state.skipped.length} skipped`:''}</span></div><div class="pg-progress" role="progressbar" aria-label="App setup progress" aria-valuenow="${state.queueFinished?100:Math.round((state.index+state.phase/3)/Math.max(1,list.length)*100)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${state.queueFinished?100:(state.index+state.phase/3)/Math.max(1,list.length)*100}%"></span></div>`:''}`;
   actions.innerHTML=state.running?'<button type="button" class="pg-button pg-quiet" data-action="cancel-queue">Stop after this app</button>':buttons(state.queueFinished||!list.length?'Next: Optimise':`Install / update ${list.length} apps`);
  }
  if(state.step===4){stage.innerHTML=header('One last step: a faster A5','Recommended settings are selected. Adjust them now, or change them later in Optimise my projector.')+`<div class="pg-optimise-list">${opts.map(([id,name])=>`<label class="pg-opt-row"><span>${name}</span><input class="pg-pill" type="checkbox" data-opt="${id}" aria-label="${name}" ${state.optimise[id]?'checked':''} ${state.optRunning?'disabled':''}></label>`).join('')}</div>${state.optRunning?`<div class="pg-progress-heading"><span>${['Applying saved preferences…','Preparing installed apps…','Saving your setup…'][Math.min(2,Math.floor(state.optProgress/34))]}</span><span>${state.optProgress}%</span></div><div class="pg-progress" role="progressbar" aria-label="Optimisation progress" aria-valuenow="${state.optProgress}" aria-valuemin="0" aria-valuemax="100"><span style="width:${state.optProgress}%"></span></div>`:`<details class="pg-opt-detail"><summary>What changes?</summary><p>Speed prepares app code, removes menu-animation delays and uses the faster stock Home route where supported. Gaming allows compatible low-latency requests. Touchscreen controls appear on touch and hide after five seconds. These are separate from picture colour settings.</p></details>`}`;actions.innerHTML=state.optRunning?'<button type="button" class="pg-button pg-primary" disabled>Optimising…</button>':buttons('Optimise & finish');}
  if(state.step===5){const n=state.installed.length;stage.innerHTML=`<div class="pg-ready"><div class="pg-ready-hero"><img class="pg-ready-projector" src="${a5Image}" alt="XBJ A5 Pro"><div class="pg-ready-check" aria-label="Setup complete">✓</div></div><h2>Your A5 is ready. Enjoy.</h2><p>${n?`${n} app${n===1?'':'s'} ready${state.skipped.length?` · ${state.skipped.length} skipped`:''}.`:'Your selected setup is ready.'}<br>${state.optFinished?'Your optimisation choices are saved.':'You can finish app setup and optimisation any time.'}</p><div class="pg-save-note"><h3>Pick up the remote and relax</h3><p>Sign in to your streaming apps when you open them.<br>Find everything else in Apps & Updates.</p></div></div>`;actions.innerHTML='<button type="button" class="pg-button pg-quiet" data-action="restart" hidden>Replay setup preview</button><button type="button" class="pg-button pg-primary" data-action="finish">Start watching</button>';}
  if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
 }
 function go(step){if(state.running||state.optRunning){stopTimers();state.running=false;state.optRunning=false;state.pending=null;hideModal();}state.step=step;render();persist();actions.querySelector('.pg-primary')?.focus();}
 function permission(next){if(!design.approvalNeeded||state.approved){next();return;}state.permissionNext=next;showModal('One quick Android approval','This A5 needs a one-time setup approval before automatic installation can continue. Allow it on the projector, then carry on. Your choices are saved.','<button type="button" class="pg-button pg-quiet" data-action="permission-later">Do this later</button><button type="button" class="pg-button pg-primary" data-action="permission-allow">I’ve allowed it</button>');}
 function startQueue(){state.queue=pick();state.installed=[];state.skipped=[];state.index=0;state.phase=0;state.queueFinished=false;state.running=true;state.stopAfter=false;render();A5Setup.installSelected(JSON.stringify(state.queue.map(a=>a.id)));}
 function optimise(){state.optRunning=true;state.optProgress=0;render();A5Setup.optimise(JSON.stringify(state.optimise));}
 let lastStatus='',jobMessage='',scanReady=false;
 function poll(){try{
  const raw=A5Setup.status();if(raw===lastStatus)return;lastStatus=raw;const data=JSON.parse(raw);jobMessage=data.message||'';
  if(data.state==='scanned'){
   const mapped=data.apps.filter(a=>a.name!=='Roblox').map(a=>({id:a.id,name:a.name.startsWith('TellyGrid')?'Live TV guide':a.name,iconUrl:'icons/'+a.icon.split('/').pop(),detail:a.detail,kind:a.kind,group:a.group}));
   streaming=mapped.filter(a=>a.group==='streaming');live=mapped.filter(a=>a.group==='live');
   state.selected=mapped.filter(a=>a.kind==='update').map(a=>a.id);
   try{const saved=JSON.parse(localStorage.getItem('a5_setup_choices')||'null');if(saved){state.selected=saved.selected.filter(id=>mapped.some(a=>a.id===id&&a.kind!=='keep'));Object.assign(state.optimise,saved.optimise);}}catch(e){}
   scanReady=true;render();actions.querySelector('.pg-primary')?.focus();
  }else if(data.state==='installing'||data.state==='installed'){
   state.running=data.state==='installing';state.queueFinished=data.state==='installed';state.index=data.index;state.phase=0;
   state.installed=(data.apps||[]).filter(a=>['ready','kept'].includes(a.status)).map(a=>a.id);
   state.skipped=(data.apps||[]).filter(a=>['attention','skipped'].includes(a.status)).map(a=>a.id);
   render();
   const heading=stage.querySelector('.pg-progress-heading>span');if(heading)heading.textContent=jobMessage;
   const current=stage.querySelectorAll('.pg-status')[data.index];if(current&&state.running)current.textContent=jobMessage.includes('Installing')?'Installing…':'Downloading…';
   (data.apps||[]).filter(a=>a.status==='attention').forEach(a=>{const row=Array.from(stage.querySelectorAll('.pg-queue-row')).find(r=>r.textContent.includes(a.name));if(row){row.querySelector('.pg-status').textContent='Needs attention';const detail=document.createElement('small');detail.textContent=a.message;row.children[1].appendChild(detail);}});
   if(state.queueFinished)actions.querySelector('.pg-primary')?.focus();
  }else if(data.state==='optimising'){
   state.optRunning=true;state.optProgress=data.total?Math.floor(data.index/data.total*100):0;render();const line=stage.querySelector('.pg-progress-heading>span');if(line)line.textContent=jobMessage+' · '+A5Setup.freeMiB()+' MiB free';
  }else if(data.state==='optimised'){state.optRunning=false;state.optFinished=true;go(5);}
  else if(data.state==='error'){state.running=false;state.optRunning=false;render();showModal('Setup needs attention',esc(jobMessage),'<button type="button" class="pg-button pg-quiet" data-action="developer-options">Developer options</button><button type="button" class="pg-button pg-primary" data-action="close-modal">OK — let me retry</button>');}
 }catch(e){stage.innerHTML=header('Setup could not load',esc(String(e)));}}
  root.addEventListener('change',event=>{const el=event.target;if(el.dataset.app){if(el.checked){if(!state.selected.includes(el.dataset.app))state.selected.push(el.dataset.app);}else state.selected=state.selected.filter(x=>x!==el.dataset.app);state.queue=[];state.queueFinished=false;render();persist();root.querySelector(`[data-app="${el.dataset.app}"]`)?.focus();}if(el.dataset.opt){state.optimise[el.dataset.opt]=el.checked;persist();}});
 root.addEventListener('click',event=>{
  const step=event.target.closest('[data-step]');if(step){go(Number(step.dataset.step));return;}
  const button=event.target.closest('[data-action]');if(!button)return;
  switch(button.dataset.action){
   case 'next':if(state.step<3)go(state.step+1);else if(state.step===3){if(state.queueFinished||!pick().length)go(4);else startQueue();}else if(state.step===4)optimise();break;
   case 'back':go(Math.max(0,state.step-1));break;
   case 'skip-setup':A5Setup.openDestination('home');break;
   case 'cancel-queue':A5Setup.stopAfterApp();state.stopAfter=true;button.textContent='Stopping after this app…';button.disabled=true;break;
   
   
   case 'permission-allow':state.approved=true;hideModal();const callback=state.permissionNext;state.permissionNext=null;if(callback)callback();break;
   case 'permission-later':state.running=false;state.optRunning=false;hideModal();render();break;
   case 'restart':stopTimers();state.installed=[];state.skipped=[];state.queue=[];state.queueFinished=false;state.optFinished=false;go(0);break;
   case 'finish':A5Setup.endCard();break;
   case 'developer-options':A5Setup.openDeveloperOptions();break;
   case 'close-modal':hideModal();actions.querySelector('.pg-primary')?.focus();break;
  }
 });
 root.addEventListener('keydown',event=>{
  if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;
  const area=modal.hidden?root.querySelector('.pg-tv'):modal;
  const candidates=[...area.querySelectorAll('button:not(:disabled),input:not(:disabled),summary')].filter(e=>e.getClientRects().length);
  const current=document.activeElement;if(!area.contains(current))return;
  const r=current.getBoundingClientRect(),cx=r.x+r.width/2,cy=r.y+r.height/2;
  const horizontal=event.key==='ArrowLeft'||event.key==='ArrowRight';const sign=event.key==='ArrowLeft'||event.key==='ArrowUp'?-1:1;
  const next=candidates.filter(e=>e!==current).map(e=>{const b=e.getBoundingClientRect(),dx=b.x+b.width/2-cx,dy=b.y+b.height/2-cy;return {e,forward:(horizontal?dx:dy)*sign,cross:Math.abs(horizontal?dy:dx)};}).filter(x=>x.forward>4).sort((a,b)=>(a.forward+a.cross*3)-(b.forward+b.cross*3))[0];
  if(next){event.preventDefault();next.e.focus();}
 });
 streaming=[];live=[];state.selected=[];
 stage.innerHTML=header('Checking your A5…','Reading installed apps and the current Projector Guy library.');actions.innerHTML='';
 setInterval(poll,650);poll();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{stopTimers();state.running=false;state.optRunning=false;state.pending=null;hideModal();render();}});tweak.addToggle(design,'approvalNeeded',{label:'Show one-time Android approval'});tweak.addToggle(design,'replacementNeeded',{label:'ITVX needs replacement'});}
})();
</script>
